name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run package and scanner tests
        run: python -m unittest discover -s tests -v

      - name: Check scanner command line interface
        run: python skills/word-math-doctor/scripts/scan_docx_math.py --help

      - name: Check Skills CLI discovery
        run: npx --yes skills add . --list
